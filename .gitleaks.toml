# gitleaks config — added by the compliance hardening pass.
# useDefault keeps the full default ruleset; the allowlist below suppresses confirmed FALSE POSITIVES only
# (documentation examples, test fixtures, templates, Bitnami SealedSecrets which are encrypted by design,
# SCAP compliance content, and public client-side config). Real secrets are NOT allowlisted.
[extend]
useDefault = true

[allowlist]
description = "confirmed false positives: docs, tests, templates, sealed secrets, SCAP content, public client config"
paths = [
  '''.*\.md$''',
  '''.*\.rst$''',
  '''.*[Ee]xample.*''',
  '''.*[Tt]emplate.*''',
  '''.*[Ss]ample.*''',
  '''.*sealed.*''',
  '''.*ssg-.*\.xml$''',
  '''.*scap.*''',
  '''.*/tests?/.*''',
  '''.*test_.*''',
  '''.*conftest.*''',
  '''.*/__tests__/.*''',
  '''.*\.spec\..*''',
  '''.*fixture.*''',
  '''.*mock.*''',
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''client/lib/auth0\.ts'''
]
