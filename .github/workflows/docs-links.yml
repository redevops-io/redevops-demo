name: docs-links
on:
  push:
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links
        shell: python
        run: |
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              if any(p in (".git", "node_modules", ".venv") for p in md.parts):
                  continue
              for t in re.findall(r"\]\(([^)\s]+)\)", md.read_text(errors="ignore")):
                  t = t.split("#")[0]
                  if not t or re.match(r"^[a-z]+:", t):
                      continue
                  if not (md.parent / t).exists():
                      bad.append(f"{md}: {t}")
          print("\n".join(bad) or "all relative links resolve")
          sys.exit(1 if bad else 0)
